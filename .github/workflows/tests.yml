name: Query Execute checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check app/static/js/app.js
      - run: node tests/test_connection_edit_form.js
      - run: node tests/test_settings_updates.js
      - run: node tests/test_totp_setup_flow.js
      - run: bash -n install_linux.sh
      - run: bash -n scripts/publish_github.sh
